<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <title>Liam's Play Curriculum</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff8e8;
      --ink: #183249;
      --paper: #ffffff;
      --muted: #6b7b87;
      --line: rgba(24, 50, 73, .13);
      --shadow: 0 12px 0 rgba(24, 50, 73, .12), 0 18px 30px rgba(24, 50, 73, .10);
      --yellow: #ffd84d;
      --orange: #ff8b45;
      --red: #f45b63;
      --blue: #48a8e8;
      --navy: #24527a;
      --green: #64c987;
      --mint: #bdeccc;
      --pink: #ff9dc7;
      --purple: #9f85e8;
      --water: #57bce8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11283a;
        --ink: #f7f4e9;
        --paper: #1b3a50;
        --muted: #b5c8d4;
        --line: rgba(255,255,255,.16);
        --shadow: 0 10px 0 rgba(0,0,0,.24), 0 18px 32px rgba(0,0,0,.22);
        --navy: #7fc4ef;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
    body {
      min-height: 100svh;
      background:
        radial-gradient(circle at 12% 9%, color-mix(in srgb, var(--yellow) 35%, transparent) 0 11%, transparent 11.5%),
        radial-gradient(circle at 92% 86%, color-mix(in srgb, var(--blue) 25%, transparent) 0 14%, transparent 14.5%),
        var(--bg);
      color: var(--ink);
      font-family: "Nunito Sans", sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 5px solid var(--ink); outline-offset: 4px; }
    .app { min-height: 100svh; position: relative; }
    .screen { display: none; min-height: 100svh; padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom)); }
    .screen.active { display: flex; flex-direction: column; animation: popIn .24s ease-out both; }
    @keyframes popIn { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: scale(1); } }

    /* Home — icons lead, labels whisper. */
    #home { justify-content: center; }
    .play-grid {
      width: min(940px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(14px, 2.2vw, 24px);
    }
    .play-card {
      min-height: clamp(165px, 24vw, 250px);
      border: 0;
      border-radius: 34px 34px 26px 34px;
      background: var(--paper);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: 1fr auto;
      place-items: center;
      padding: 18px 14px 14px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transform: translateY(0);
      transition: transform .14s ease, box-shadow .14s ease;
    }
    .play-card::after {
      content: ""; position: absolute; width: 74px; height: 74px; border-radius: 50%;
      right: -18px; top: -20px; background: color-mix(in srgb, var(--card) 32%, transparent);
    }
    .play-card:active { transform: translateY(8px); box-shadow: 0 4px 0 rgba(24,50,73,.12); }
    .play-card svg { width: min(128px, 70%); height: min(128px, 70%); overflow: visible; filter: drop-shadow(0 5px 0 rgba(24,50,73,.09)); }
    .play-card span { font-family: "Fredoka", sans-serif; font-size: clamp(18px, 2.4vw, 25px); font-weight: 700; letter-spacing: .01em; }
    .card-find { --card: var(--yellow); background: color-mix(in srgb, var(--yellow) 42%, var(--paper)); }
    .card-clap { --card: var(--orange); background: color-mix(in srgb, var(--orange) 32%, var(--paper)); }
    .card-pour { --card: var(--blue); background: color-mix(in srgb, var(--blue) 27%, var(--paper)); }
    .card-tip { --card: var(--red); background: color-mix(in srgb, var(--red) 20%, var(--paper)); }
    .card-move { --card: var(--green); background: color-mix(in srgb, var(--green) 30%, var(--paper)); }
    .card-sort { --card: var(--pink); background: color-mix(in srgb, var(--pink) 27%, var(--paper)); }
    .card-song { --card: var(--purple); background: color-mix(in srgb, var(--purple) 25%, var(--paper)); }
    .card-watch { --card: var(--red); background: color-mix(in srgb, var(--red) 23%, var(--paper)); }
    .card-listen { --card: var(--orange); background: color-mix(in srgb, var(--orange) 23%, var(--paper)); }
    .card-pop { --card: var(--blue); background: color-mix(in srgb, var(--blue) 23%, var(--paper)); }

    .topbar { width: min(960px, 100%); margin: 0 auto 10px; min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .back, .sound-toggle, .big-action {
      border: 0; cursor: pointer; display: grid; place-items: center; background: var(--paper); box-shadow: 0 5px 0 rgba(24,50,73,.14);
    }
    .back, .sound-toggle { width: 56px; height: 56px; border-radius: 50%; }
    .back:active, .sound-toggle:active, .big-action:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(24,50,73,.14); }
    .back svg, .sound-toggle svg { width: 28px; height: 28px; }
    .scene-word { font-family: "Fredoka", sans-serif; font-size: clamp(24px, 4vw, 38px); font-weight: 700; }
    .stage { width: min(960px, 100%); flex: 1; min-height: 0; margin: 0 auto; display: grid; place-items: center; position: relative; }

    /* Find */
    .treasure-mat {
      width: min(820px, 100%); min-height: min(650px, 72svh); border-radius: 42px;
      background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--yellow) 24%, var(--paper)) 0 24px, var(--paper) 24px 48px);
      box-shadow: inset 0 0 0 4px var(--line), var(--shadow);
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: clamp(18px, 4vw, 48px);
      place-items: center;
    }
    .object {
      width: min(210px, 42vw); aspect-ratio: 1; border: 0; border-radius: 50%; background: transparent; cursor: pointer;
      display: grid; place-items: center; position: relative;
    }
    .object svg { width: 78%; height: 78%; overflow: visible; transition: transform .18s ease; filter: drop-shadow(0 10px 0 rgba(24,50,73,.12)); }
    .object:active svg, .object.playing svg { transform: scale(1.18) rotate(-5deg); }
    .object-name {
      position: absolute; inset: auto 50% 3px auto; transform: translateX(50%) translateY(8px) scale(.7);
      opacity: 0; background: var(--paper); color: var(--ink); padding: 7px 16px; border-radius: 999px;
      font-family: "Fredoka", sans-serif; font-size: clamp(20px, 4vw, 30px); box-shadow: 0 4px 0 rgba(24,50,73,.12);
      transition: .18s ease;
    }
    .object.playing .object-name { opacity: 1; transform: translateX(50%) translateY(0) scale(1); }

    /* Clap */
    .clap-wrap { width: min(820px,100%); display: grid; gap: 26px; place-items: center; }
    .clap-demo { display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 76px; }
    .beat-dot { width: 28px; height: 28px; border-radius: 50%; background: var(--line); transition: .12s; }
    .beat-dot.on { background: var(--yellow); transform: scale(1.5); box-shadow: 0 0 0 10px color-mix(in srgb, var(--yellow) 25%, transparent); }
    .hands {
      border: 0; background: transparent; cursor: pointer; width: min(390px, 86vw); aspect-ratio: 1.25; position: relative;
      filter: drop-shadow(0 12px 0 rgba(24,50,73,.12));
    }
    .hands svg { width: 100%; height: 100%; overflow: visible; }
    .hands .left-hand { transform-origin: 45% 55%; transition: transform .09s; }
    .hands .right-hand { transform-origin: 55% 55%; transition: transform .09s; }
    .hands.hit .left-hand { transform: translateX(16px) rotate(7deg); }
    .hands.hit .right-hand { transform: translateX(-16px) rotate(-7deg); }
    .burst { opacity: 0; transform-origin: center; }
    .hands.hit .burst { animation: burst .35s ease-out; }
    @keyframes burst { 0% { opacity: 1; transform: scale(.3); } 100% { opacity: 0; transform: scale(1.3); } }
    .big-action {
      min-width: 112px; height: 64px; border-radius: 25px; background: var(--yellow); padding: 0 25px;
      font-family: "Fredoka", sans-serif; font-size: 22px; font-weight: 700;
    }

    /* Pour — one clear action, with shape cues as well as color. */
    .pour-wrap{width:min(850px,100%);display:grid;gap:14px;place-items:center}
    .pour-stage{width:100%;min-height:min(600px,66svh);border-radius:44px;background:color-mix(in srgb,var(--blue) 13%,var(--paper));overflow:hidden;position:relative;box-shadow:inset 0 0 0 4px var(--line),var(--shadow)}
    .pour-stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12%;background:color-mix(in srgb,var(--water) 18%,transparent);border-radius:50% 50% 0 0/30% 30% 0 0}
    .pitcher{position:absolute;z-index:5;left:50%;top:4%;translate:-50% 0;width:clamp(170px,28vw,230px);aspect-ratio:1.18;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 10px 0 rgba(24,50,73,.12));transition:transform .2s ease}
    .pitcher:active{transform:translateY(5px)}
    .pitcher.pouring{transform:translateX(10px) rotate(12deg)}
    .pitcher svg{width:100%;height:100%;overflow:visible}
    .pour-stream{position:absolute;z-index:4;left:51%;top:31%;width:18px;height:0;border-radius:999px;background:var(--water);opacity:0;transform:rotate(-4deg);transform-origin:top;transition:height .18s ease,opacity .12s ease}
    .pour-stream.show{height:clamp(118px,24vw,210px);opacity:.92;animation:waterWiggle .3s ease-in-out infinite alternate}
    @keyframes waterWiggle{to{transform:translateX(4px) rotate(2deg)}}
    .pour-cups{position:absolute;z-index:3;left:4%;right:4%;bottom:9%;height:38%;display:grid;grid-template-columns:repeat(3,1fr);gap:3%;align-items:end}
    .pour-cup{position:relative;width:100%;max-width:220px;justify-self:center;aspect-ratio:.95}
    .pour-cup svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 9px 0 rgba(24,50,73,.11))}
    .pour-cup-symbol{position:absolute;z-index:2;left:50%;top:46%;translate:-50% -50%;width:34%;height:34%;display:grid;place-items:center;color:#183249;pointer-events:none}
    .pour-cup-symbol svg{width:100%;height:100%;filter:none}
    .middle-cup{transform:scale(1.08)}
    .middle-liquid{transition:y .15s linear,height .15s linear}
    .pour-again{position:absolute;z-index:8;right:18px;top:18px;min-width:124px;height:58px;border:0;border-radius:23px;background:var(--yellow);box-shadow:0 6px 0 rgba(24,50,73,.15);font-family:"Fredoka",sans-serif;font-size:20px;font-weight:700;cursor:pointer;padding:0 18px}
    .pour-again:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(24,50,73,.15)}
    .pour-mascot{position:absolute;z-index:7;left:3%;top:4%;width:clamp(92px,17vw,142px);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 7px 0 rgba(24,50,73,.1));transform-origin:70% 70%;animation:mascotWave 1.7s ease-in-out infinite}
    .pour-mascot.demo{animation:mascotDemo .65s ease-in-out infinite alternate}
    @keyframes mascotWave{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
    @keyframes mascotDemo{to{transform:translateY(-8px) rotate(7deg) scale(1.04)}}
    .spill-party{position:absolute;z-index:9;inset:0;pointer-events:none;opacity:0}
    .spill-party::before{content:"";position:absolute;left:25%;right:18%;bottom:4%;height:18%;border-radius:50%;background:color-mix(in srgb,var(--water) 68%,transparent)}
    .spill-party img{position:absolute;right:5%;bottom:3%;width:clamp(120px,24vw,190px);filter:drop-shadow(0 8px 0 rgba(24,50,73,.12))}
    .spill-party span{position:absolute;right:21%;bottom:28%;background:var(--paper);padding:9px 15px;border-radius:22px;font-family:"Fredoka",sans-serif;font-size:clamp(20px,4vw,30px);font-weight:700;box-shadow:0 5px 0 rgba(24,50,73,.12)}
    .spill-party.go{animation:spillParty 1.7s ease both}
    @keyframes spillParty{0%{opacity:0;transform:scale(.8)}18%,76%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
    .parent-prompt{margin:0;max-width:720px;padding:9px 16px;border-radius:18px;background:var(--paper);box-shadow:0 4px 0 rgba(24,50,73,.1);font-size:clamp(15px,2.4vw,18px);font-weight:700;text-align:center;line-height:1.35}
    .tip-stage{width:min(850px,100%);min-height:min(640px,70svh);border-radius:44px;background:color-mix(in srgb,var(--red) 10%,var(--paper));overflow:hidden;position:relative;box-shadow:inset 0 0 0 4px var(--line),var(--shadow)}
    .tip-stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:19%;background:color-mix(in srgb,var(--water) 32%,transparent);border-radius:50% 50% 0 0/20% 20% 0 0}
    .tip-cup{position:absolute;width:clamp(126px,24vw,210px);aspect-ratio:.9;border:0;background:transparent;cursor:pointer;z-index:2;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
    .tip-cup svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 0 rgba(24,50,73,.12))}
    .tip-a{left:11%;top:17%}.tip-b{right:11%;bottom:17%}.tip-a.tilt{transform:translate(55%,10%) rotate(43deg)}.tip-b.tilt{transform:translate(-55%,-10%) rotate(-43deg)}
    .tip-fill{transition:y .6s ease,height .6s ease}.tip-stream{position:absolute;width:18px;height:0;border-radius:999px;background:var(--water);opacity:0;z-index:1;transform-origin:top}.tip-stream.a{left:48%;top:38%;transform:rotate(-24deg)}.tip-stream.b{right:48%;top:45%;transform:rotate(24deg)}.tip-stream.show{animation:tipStream .7s ease}
    @keyframes tipStream{0%,100%{height:0;opacity:0}16%,75%{height:180px;opacity:.9}}
    .tip-splash{position:absolute;width:28px;height:28px;border:7px solid var(--water);border-radius:50%;opacity:0;z-index:3;pointer-events:none}.tip-splash.go{animation:splash .55s ease-out}
    @keyframes splash{from{opacity:.8;transform:scale(.3)}to{opacity:0;transform:scale(3)}}

    /* Move */
    .animal-stage { width: min(900px,100%); display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(12px,2vw,22px); }
    .animal {
      border:0; border-radius:42px; min-height:clamp(260px,42vw,430px); padding:18px; cursor:pointer; overflow:hidden; position:relative;
      box-shadow:var(--shadow); background:var(--paper);
    }
    .animal:nth-child(1){background:color-mix(in srgb,var(--green) 28%,var(--paper))}
    .animal:nth-child(2){background:color-mix(in srgb,var(--yellow) 32%,var(--paper))}
    .animal:nth-child(3){background:color-mix(in srgb,var(--blue) 24%,var(--paper))}
    .animal svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 0 rgba(24,50,73,.1));}
    .animal.frog.go svg{animation:frogJump .85s ease}
    .animal.duck.go svg{animation:duckWaddle .8s ease}
    .animal.elephant.go svg{animation:eleStomp .8s ease}
    @keyframes frogJump{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-80px) scale(1.05,.95)}}
    @keyframes duckWaddle{0%,100%{transform:rotate(0)}20%{transform:translateX(-10px) rotate(-8deg)}45%{transform:translateX(10px) rotate(8deg)}70%{transform:translateX(-8px) rotate(-6deg)}}
    @keyframes eleStomp{0%,100%{transform:translateY(0)}25%{transform:translateY(-18px)}42%{transform:translateY(8px)}57%{transform:translateY(-10px)}78%{transform:translateY(5px)}}

    /* Sort */
    .sort-stage { width:min(900px,100%); min-height:min(670px,72svh); border-radius:44px; position:relative; overflow:hidden; background:color-mix(in srgb,var(--pink) 13%,var(--paper)); box-shadow:inset 0 0 0 4px var(--line),var(--shadow); touch-action:none; }
    .bins { position:absolute; left:5%; right:5%; bottom:5%; height:30%; display:grid; grid-template-columns:repeat(3,1fr); gap:4%; }
    .bin { position:relative; border-radius:18px 18px 35px 35px; border:8px solid color-mix(in srgb,var(--ink) 18%,transparent); border-top-width:16px; padding:0; cursor:pointer; transition:transform .16s ease, box-shadow .16s ease; }
    .bin[data-color="red"]{background:color-mix(in srgb,var(--red) 52%,var(--paper))}
    .bin[data-color="blue"]{background:color-mix(in srgb,var(--blue) 52%,var(--paper))}
    .bin[data-color="yellow"]{background:color-mix(in srgb,var(--yellow) 60%,var(--paper))}
    .bin.ready{transform:translateY(-6px);box-shadow:0 0 0 8px color-mix(in srgb,var(--yellow) 56%,transparent)}
    .bin.try-again{animation:gentleNo .34s ease}
    .pom { position:absolute; width:clamp(62px,11vw,92px); aspect-ratio:1; border:0; border-radius:50%; cursor:grab; z-index:3; box-shadow:inset -10px -12px 0 rgba(24,50,73,.12),0 7px 0 rgba(24,50,73,.14); touch-action:none; transition:transform .14s ease, box-shadow .14s ease; }
    .pom.selected{transform:scale(1.14);box-shadow:inset -10px -12px 0 rgba(24,50,73,.12),0 0 0 9px color-mix(in srgb,var(--yellow) 72%,transparent),0 9px 0 rgba(24,50,73,.14)}
    .pom::before,.pom::after{content:"";position:absolute;background:inherit;border-radius:50%;inset:12% -7%;z-index:-1}.pom::after{inset:-7% 12%}
    .pom[data-color="red"]{background:var(--red)}
    .pom[data-color="blue"]{background:var(--blue)}
    .pom[data-color="yellow"]{background:var(--yellow)}
    .pom.dragging{cursor:grabbing;transform:scale(1.14);z-index:10;}
    .pom.done{animation:pomDone .45s ease forwards;pointer-events:none}
    @keyframes pomDone{40%{transform:scale(1.22)}100%{transform:scale(.2);opacity:0}}
    .celebrate { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; opacity:0; z-index:12; }
    .celebrate svg{width:min(420px,75%);height:auto;}
    .celebrate.go{animation:celebrate 1.1s ease}
    @keyframes celebrate{0%{opacity:0;transform:scale(.3) rotate(-8deg)}20%,70%{opacity:1;transform:scale(1.06) rotate(3deg)}100%{opacity:0;transform:scale(1.3) rotate(0)}}

    /* Song */
    .song-stage { width:min(860px,100%); min-height:min(650px,72svh); border-radius:48px; background:color-mix(in srgb,var(--purple) 18%,var(--paper)); box-shadow:inset 0 0 0 4px var(--line),var(--shadow); display:grid; place-items:center; position:relative; overflow:hidden; }
    .name-orbit { width:min(520px,88%); aspect-ratio:1; position:relative; display:grid; place-items:center; }
    .name-button { width:58%; aspect-ratio:1; border-radius:50%; border:0; background:var(--yellow); box-shadow:0 13px 0 rgba(24,50,73,.15),0 20px 35px rgba(24,50,73,.14); cursor:pointer; display:grid; place-items:center; font-family:"Fredoka",sans-serif; font-size:clamp(36px,10vw,72px); font-weight:700; letter-spacing:.02em; position:relative; z-index:3; }
    .name-button:active{transform:translateY(8px);box-shadow:0 5px 0 rgba(24,50,73,.15)}
    .note { position:absolute; width:22%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; }
    .note svg{width:56%;height:56%}
    .note:nth-child(1){left:0;top:8%;background:var(--pink)}
    .note:nth-child(2){right:0;top:8%;background:var(--green)}
    .note:nth-child(3){left:0;bottom:8%;background:var(--blue)}
    .note:nth-child(4){right:0;bottom:8%;background:var(--orange)}
    .song-stage.playing .note:nth-child(1){animation:noteBounce .55s ease 0s infinite alternate}
    .song-stage.playing .note:nth-child(2){animation:noteBounce .55s ease .15s infinite alternate}
    .song-stage.playing .note:nth-child(3){animation:noteBounce .55s ease .3s infinite alternate}
    .song-stage.playing .note:nth-child(4){animation:noteBounce .55s ease .45s infinite alternate}
    .song-stage.playing .name-button{animation:namePulse .55s ease infinite alternate}
    @keyframes noteBounce{to{transform:translateY(-24px) rotate(10deg) scale(1.08)}}
    @keyframes namePulse{to{transform:scale(1.06);background:var(--orange)}}
    .song-rings{position:absolute;inset:0;pointer-events:none}
    .song-ring{position:absolute;border:7px solid color-mix(in srgb,var(--purple) 55%,transparent);border-radius:50%;inset:50%;opacity:0}
    .song-stage.playing .song-ring{animation:ring 1.1s ease-out infinite}
    .song-stage.playing .song-ring:nth-child(2){animation-delay:.55s}
    @keyframes ring{0%{inset:48%;opacity:.8}100%{inset:4%;opacity:0}}

    /* Animal movies now arrive as earned celebration rewards. */
    .reward-overlay{position:fixed;z-index:50;inset:0;background:rgba(10,30,43,.78);display:none;place-items:center;padding:18px}
    .reward-overlay.show{display:grid;animation:popIn .22s ease-out both}
    .reward-card{width:min(820px,100%);background:var(--paper);border-radius:36px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px}
    .reward-card video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:25px;background:#172b3b}
    .reward-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 5px}
    .reward-head strong{font-family:"Fredoka",sans-serif;font-size:clamp(22px,4vw,32px)}
    .reward-head small{display:block;color:var(--muted);font-size:14px}
    .reward-close{width:58px;height:58px;flex:0 0 auto;border:0;border-radius:50%;background:var(--yellow);box-shadow:0 5px 0 rgba(24,50,73,.14);font-size:31px;line-height:1;cursor:pointer}
    .reward-close:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(24,50,73,.14)}

    /* Listen — a spoken find-the-animal prompt with responsive characters. */
    .listen-stage{width:min(850px,100%);min-height:min(650px,72svh);border-radius:44px;background:color-mix(in srgb,var(--orange) 15%,var(--paper));box-shadow:inset 0 0 0 4px var(--line),var(--shadow);display:grid;grid-template-rows:auto 1fr auto;place-items:center;padding:clamp(18px,4vw,38px);overflow:hidden;position:relative}
    .listen-progress{display:flex;gap:12px;min-height:26px;align-items:center;justify-content:center}
    .listen-progress i{width:20px;height:20px;border-radius:50%;background:color-mix(in srgb,var(--ink) 14%,transparent);transition:transform .18s ease,background .18s ease}
    .listen-progress i.now{background:var(--yellow);transform:scale(1.22)}
    .listen-progress i.done{background:var(--green)}
    .listener-animals{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);align-items:center}
    .listener-animal{border:0;background:transparent;cursor:pointer;position:relative;aspect-ratio:1;display:grid;place-items:center}
    .listener-animal svg{width:92%;height:92%;overflow:visible;filter:drop-shadow(0 8px 0 rgba(24,50,73,.1));transition:transform .18s ease,filter .18s ease}
    .listener-animal.calling svg{animation:listenBounce .4s ease 2 alternate}
    .listener-animal.correct svg{transform:scale(1.12);filter:drop-shadow(0 0 0 var(--green)) drop-shadow(0 10px 0 rgba(24,50,73,.1))}
    .listener-animal.try-again svg{animation:gentleNo .34s ease}
    @keyframes listenBounce{to{transform:translateY(-18px) scale(1.08) rotate(4deg)}}
    @keyframes gentleNo{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}70%{transform:translateX(7px)}}
    .listen-controls{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
    .listen-play{width:94px;height:94px;border:0;border-radius:50%;background:var(--yellow);box-shadow:0 9px 0 rgba(24,50,73,.17);cursor:pointer;display:grid;place-items:center}
    .listen-play:active{transform:translateY(7px);box-shadow:0 2px 0 rgba(24,50,73,.17)}
    .listen-play svg{width:46px;height:46px;margin-left:6px}
    .listen-stage.playing::before,.listen-stage.playing::after{content:"";position:absolute;width:70px;height:70px;border:8px solid color-mix(in srgb,var(--orange) 58%,transparent);border-radius:50%;left:50%;bottom:40px;translate:-50% 0;animation:soundRing 1.25s ease-out infinite;pointer-events:none}
    .listen-stage.playing::after{animation-delay:.62s}
    .listen-star{position:absolute;inset:50% auto auto 50%;translate:-50% -50%;width:min(250px,52%);opacity:0;pointer-events:none;z-index:5}
    .listen-star.go{animation:popStar .85s ease}
    @keyframes soundRing{from{opacity:.8;transform:scale(.5)}to{opacity:0;transform:scale(5)}}

    /* Pop — a resettable visual-and-sound sensory game. */
    .pop-stage{width:min(860px,100%);min-height:min(650px,72svh);border-radius:44px;background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 26%,var(--paper)),color-mix(in srgb,var(--pink) 17%,var(--paper)));box-shadow:inset 0 0 0 4px var(--line),var(--shadow);position:relative;overflow:hidden}
    .bubble{position:absolute;width:clamp(72px,13vw,112px);aspect-ratio:1;border:5px solid rgba(255,255,255,.78);border-radius:50%;cursor:pointer;background:color-mix(in srgb,var(--bubble) 58%,transparent);box-shadow:inset 14px 16px 0 rgba(255,255,255,.32),0 9px 0 rgba(24,50,73,.10);transition:transform .15s ease,opacity .15s ease}
    .bubble::after{content:"";position:absolute;width:18%;height:18%;border-radius:50%;background:rgba(255,255,255,.75);top:18%;left:22%}
    .bubble.popped{transform:scale(1.5);opacity:0;pointer-events:none}
    .bubble:nth-child(1){--bubble:var(--pink);left:8%;top:10%}.bubble:nth-child(2){--bubble:var(--yellow);left:38%;top:6%}.bubble:nth-child(3){--bubble:var(--green);right:8%;top:16%}.bubble:nth-child(4){--bubble:var(--blue);left:18%;top:44%}.bubble:nth-child(5){--bubble:var(--purple);right:24%;top:42%}.bubble:nth-child(6){--bubble:var(--orange);left:7%;bottom:6%}.bubble:nth-child(7){--bubble:var(--red);left:44%;bottom:8%}.bubble:nth-child(8){--bubble:var(--mint);right:7%;bottom:6%}
    .pop-star{position:absolute;inset:50% auto auto 50%;translate:-50% -50%;width:min(260px,55%);opacity:0;pointer-events:none}
    .pop-star.go{animation:popStar 1s ease}
    @keyframes popStar{0%{opacity:0;transform:scale(.2) rotate(-12deg)}25%,70%{opacity:1;transform:scale(1.08) rotate(5deg)}100%{opacity:0;transform:scale(1.4) rotate(0)}}

    @media (max-width: 650px) {
      .screen{padding-left:12px;padding-right:12px}
      .play-grid{grid-template-columns:repeat(2,1fr);gap:12px}
      .play-card{min-height:clamp(145px,29svh,210px);border-radius:28px 28px 22px 28px;padding:12px 8px 10px}
      .play-card svg{width:min(100px,70%);height:min(100px,70%)}
      .play-card span{font-size:18px}
      .animal-stage{grid-template-columns:1fr;gap:12px}
      .animal{min-height:155px;border-radius:28px;padding:8px}
      .animal svg{width:70%;margin:auto;display:block}
      .treasure-mat{min-height:72svh;padding:10px;border-radius:30px}
      .pour-stage,.tip-stage,.sort-stage,.song-stage{min-height:72svh;border-radius:30px}
      .pitcher{top:10%;width:160px}.pour-mascot{top:7%;left:1%;width:90px}.pour-again{top:12px;right:12px;min-width:106px;height:52px;font-size:17px;padding:0 12px}
      .pour-cups{left:2%;right:2%;bottom:11%;height:34%;gap:1%}.pour-stream{top:34%}.spill-party span{right:35%;bottom:29%}
      .tip-a{left:3%;top:17%}.tip-b{right:3%;bottom:19%}
      .pom{width:64px}
      .topbar{margin-bottom:6px}
      .back,.sound-toggle{width:52px;height:52px}
      .video-shell{border-radius:26px}
      .video-play{width:76px;height:76px}
      .listen-stage,.pop-stage{min-height:72svh;border-radius:30px}
      .listen-stage{padding:14px}
      .listener-animals{grid-template-columns:1fr 1fr 1fr}
      .listen-play{width:82px;height:82px}
    }
    @media (max-height: 620px) and (orientation: landscape) {
      .play-grid{grid-template-columns:repeat(3,1fr)}
      .play-card{min-height:135px}
      .screen{padding-top:8px;padding-bottom:8px}
      .topbar{min-height:48px}
      .back,.sound-toggle{width:46px;height:46px}
      .stage{min-height:400px}
      .animal{min-height:300px}
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
    }
    .home-hero{display:flex;justify-content:center;padding:10px 0 2px}
    .home-mascot{width:clamp(96px,18vw,140px);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 0 rgba(24,50,73,.18))}
  </style>
</head>
<body>
<div class="app">
  <main id="home" class="screen active" aria-label="Choose a play activity">

    </div></div>
  </section>

  <section id="clap" class="screen" aria-label="Clap a rhythm">
    <div class="topbar"><button class="back" aria-label="Back to activities"><svg viewBox="0 0 32 32"><path d="M19 7l-9 9 9 9" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="scene-word" aria-hidden="true">Clap</div><button class="sound-toggle" aria-label="Toggle sound"><svg viewBox="0 0 32 32"><path d="M6 13h6l7-6v18l-7-6H6z" fill="currentColor"/><path class="sound-wave" d="M23 11q6 5 0 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button></div>

      </div>

  </section>

<script>
(function(){

    });
  }

      var len=Math.floor(a.sampleRate*.08), buf=a.createBuffer(1,len,a.sampleRate), data=buf.getChannelData(0);
      for(var i=0;i<len;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);

  document.getElementById('play-pattern').addEventListener('click',function(){var beats=[0,.48,.96,1.24];beats.forEach(function(t,i){setTimeout(function(){dots.forEach(function(d){d.classList.remove('on')});dots[i].classList.add('on');hit();setTimeout(function(){dots[i].classList.remove('on')},210)},t*1000)})});

  var pitcher=document.querySelector('.pitcher'),middleLiquid=document.querySelector('.middle-liquid'),pourStream=document.querySelector('.pour-stream'),pourMascot=document.querySelector('.pour-mascot'),spillParty=document.querySelector('.spill-party'),pourAgain=document.querySelector('.pour-again'),demoTimer=null;

  var sortStage=document.querySelector('.sort-stage'),poms=[].slice.call(document.querySelectorAll('.pom')),bins=[].slice.call(document.querySelectorAll('.bin')),doneCount=0,selectedPom=null;

  function resetSort(){doneCount=0;clearPomChoice();poms.forEach(function(p,i){p.classList.remove('done','dragging');p.style.left=starts[i][0]+'%';p.style.top=starts[i][1]+'%';p.style.transform='';p.style.opacity='';p.style.pointerEvents=''});}

  poms.forEach(function(p){var drag=false,moved=false,ox=0,oy=0,startX=0,startY=0;function down(e){ensureAudio();drag=true;moved=false;startX=e.clientX;startY=e.clientY;p.setPointerCapture(e.pointerId);var r=p.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;p.classList.add('dragging')}function move(e){if(!drag)return;if(Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY)>10)moved=true;var sr=sortStage.getBoundingClientRect();var x=Math.max(0,Math.min(sr.width-p.offsetWidth,e.clientX-sr.left-ox));var y=Math.max(0,Math.min(sr.height-p.offsetHeight,e.clientY-sr.top-oy));p.style.left=x+'px';p.style.top=y+'px'}function up(){if(!drag)return;drag=false;p.classList.remove('dragging');var pr=p.getBoundingClientRect(),cx=pr.left+pr.width/2,cy=pr.top+pr.height/2,match=null;bins.forEach(function(bin){var r=bin.getBoundingClientRect();if(cx>r.left&&cx<r.right&&cy>r.top&&cy<r.bottom)match=bin});if(moved&&match&&match.dataset.color===p.dataset.color){finishPom(p)}else if(moved){var i=poms.indexOf(p);p.style.left=starts[i][0]+'%';p.style.top=starts[i][1]+'%';if(match){match.classList.remove('try-again');void match.offsetWidth;match.classList.add('try-again');setTimeout(function(){match.classList.remove('try-again')},400)}}}p.addEventListener('pointerdown',down);p.addEventListener('pointermove',move);p.addEventListener('pointerup',up);p.addEventListener('pointercancel',up);p.addEventListener('click',function(){if(moved||p.classList.contains('done'))return;var choosing=selectedPom!==p;clearPomChoice();if(choosing){selectedPom=p;p.classList.add('selected');bins.forEach(function(b){b.classList.add('ready')});tone(380,.12,'sine',0,.08)}})});
  bins.forEach(function(bin){bin.addEventListener('click',function(){if(!selectedPom)return;if(bin.dataset.color===selectedPom.dataset.color){finishPom(selectedPom)}else{bin.classList.remove('try-again');void bin.offsetWidth;bin.classList.add('try-again');setTimeout(function(){bin.classList.remove('try-again')},400);tone(260,.1,'sine',0,.05)}})});

  var songStage=document.querySelector('.song-stage'),songBtn=document.querySelector('.name-button'),songTimer=null;
  function stopSong(){songStage.classList.remove('playing');if(songTimer){clearTimeout(songTimer);songTimer=null}}
  songBtn.addEventListener('click',function(){ensureAudio();stopSong();songStage.classList.add('playing');var notes=[261.63,329.63,392,329.63,261.63,261.63,392,523.25];var times=[0,.38,.76,1.14,1.52,1.9,2.28,2.66];notes.forEach(function(n,i){tone(n,.27,i===6?'triangle':'sine',times[i],.13);if(i===4||i===5)clap(times[i])});songTimer=setTimeout(stopSong,3400)});

  var rewardOverlay=document.querySelector('.reward-overlay'),rewardMovie=document.getElementById('reward-movie'),rewardClose=document.querySelector('.reward-close');
  function showReward(){var movies=[['video/frog-garden.mp4','images/frog-garden.jpg'],['video/frog-lilypad.mp4','images/frog-lilypad.jpg']],pick=movies[rewardIndex++%movies.length];rewardMovie.src=pick[0];rewardMovie.poster=pick[1];rewardMovie.muted=muted;rewardOverlay.classList.add('show');rewardOverlay.setAttribute('aria-hidden','false');rewardMovie.play().catch(function(){ /* controls remain available if autoplay is blocked */ });rewardClose.focus()}
  function hideReward(){rewardMovie.pause();rewardMovie.currentTime=0;rewardOverlay.classList.remove('show');rewardOverlay.setAttribute('aria-hidden','true')}
  rewardClose.addEventListener('click',hideReward);rewardMovie.addEventListener('ended',hideReward);rewardOverlay.addEventListener('click',function(e){if(e.target===rewardOverlay)hideReward()});

  var listenStage=document.querySelector('.listen-stage'),listenPlay=document.querySelector('.listen-play'),listenerAnimals=[].slice.call(document.querySelectorAll('.listener-animal')),listenPips=[].slice.call(document.querySelectorAll('.listen-progress i')),listenStar=document.querySelector('.listen-star'),listenOrder=[],listenRound=0,listenTarget='',listenLocked=false,listenTimer=null;
  function animalSound(kind){if(kind==='frog'){tone(180,.16,'square',0,.09);tone(260,.18,'square',.18,.08)}else if(kind==='duck'){tone(530,.09,'sawtooth',0,.07);tone(410,.12,'sawtooth',.13,.07)}else{tone(92,.22,'sine',0,.18);tone(78,.2,'sine',.32,.17)}}
  function updateListenPips(){listenPips.forEach(function(p,i){p.classList.toggle('done',i<listenRound);p.classList.toggle('now',i===listenRound&&!!listenTarget)})}
  function playListenPrompt(){if(!listenTarget)return;listenStage.classList.add('playing');animalSound(listenTarget);clearTimeout(listenTimer);listenTimer=setTimeout(function(){listenStage.classList.remove('playing')},850)}
  function nextListenRound(){listenerAnimals.forEach(function(a){a.classList.remove('calling','correct','try-again')});listenTarget=listenOrder[listenRound];listenLocked=false;updateListenPips();playListenPrompt()}
  function startListening(){listenOrder=['duck','frog','elephant'];for(var i=listenOrder.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),hold=listenOrder[i];listenOrder[i]=listenOrder[j];listenOrder[j]=hold}listenRound=0;listenTarget='';nextListenRound()}
  function clearListening(){clearTimeout(listenTimer);listenStage.classList.remove('playing');listenTarget='';listenLocked=false;listenRound=0;listenerAnimals.forEach(function(a){a.classList.remove('calling','correct','try-again')});listenPips.forEach(function(p){p.classList.remove('done','now')});listenStar.classList.remove('go')}
  listenPlay.addEventListener('click',function(){if(!listenTarget)startListening();else playListenPrompt()});
  listenerAnimals.forEach(function(a){a.addEventListener('click',function(){if(!listenTarget){a.classList.remove('calling');void a.offsetWidth;a.classList.add('calling');animalSound(a.dataset.kind);setTimeout(function(){a.classList.remove('calling')},850);return}if(listenLocked)return;if(a.dataset.kind===listenTarget){listenLocked=true;a.classList.add('correct');listenPips[listenRound].classList.remove('now');listenPips[listenRound].classList.add('done');listenStar.classList.remove('go');void listenStar.offsetWidth;listenStar.classList.add('go');chime();listenRound++;if(listenRound<3){listenTimer=setTimeout(nextListenRound,900)}else{listenTarget='';showReward();listenTimer=setTimeout(function(){chime();clearListening()},1300)}}else{a.classList.remove('try-again');void a.offsetWidth;a.classList.add('try-again');listenTimer=setTimeout(function(){a.classList.remove('try-again');playListenPrompt()},430)}})});

  var bubbles=[].slice.call(document.querySelectorAll('.bubble')),popCount=0,popTimer=null,popStar=document.querySelector('.pop-star');
  function resetPop(){popCount=0;if(popTimer){clearTimeout(popTimer);popTimer=null}popStar.classList.remove('go');bubbles.forEach(function(b){b.classList.remove('popped')})}
  bubbles.forEach(function(b,i){b.addEventListener('click',function(){if(b.classList.contains('popped'))return;b.classList.add('popped');popCount++;tone(310+i*38,.14,'sine',0,.12);tone(520+i*24,.1,'triangle',.05,.08);if(popCount===bubbles.length){popStar.classList.remove('go');void popStar.offsetWidth;popStar.classList.add('go');chime();showReward();popTimer=setTimeout(resetPop,1200)}})});

  function stopMedia(){stopPour();clearTimeout(demoTimer);hideReward();clearListening()}
})();
