<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <title>Liam's Block Pop</title>
  <style>
    :root{
      --ink:#183249; --paper:#fff7e8; --card:#fffdf6;
      --red:#f45b63; --yellow:#ffc93c; --blue:#48a8e8; --green:#58c472;
      --shadow:0 10px 24px rgba(24,50,73,.14);
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0}
    body{
      font-family:"Fredoka","Nunito Sans",system-ui,sans-serif; color:var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #ffe9a8 0 90px, transparent 91px),
        radial-gradient(circle at 92% 96%, #bfe3ff 0 120px, transparent 121px),
        var(--paper);
      min-height:100dvh; touch-action:manipulation; overscroll-behavior:none;
      -webkit-user-select:none; user-select:none;
    }
    .app{max-width:620px;margin:0 auto;padding:10px 12px calc(env(safe-area-inset-bottom) + 14px)}
    header{display:flex;align-items:center;gap:10px;padding:2px 2px 8px}
    header img.mascot{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(24,50,73,.15))}
    header img.mascot.dance{animation:wiggle .9s ease-in-out}
    @keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(1.08)}45%{transform:rotate(8deg)}70%{transform:rotate(-5deg) scale(1.05)}}
    header h1{font-size:clamp(24px,6vw,34px);margin:0;font-weight:700;letter-spacing:.2px;flex:1}
    .sound-pill{
      border:3px solid rgba(24,50,73,.16); background:var(--card); color:var(--ink);
      border-radius:999px; padding:8px 14px; font-family:inherit; font-weight:700;
      font-size:15px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; min-height:48px;
    }
    .sound-pill .dot{width:12px;height:12px;border-radius:50%;background:#e8a13a;display:inline-block}
    .sound-pill.on .dot{background:#58c472}
    .sound-pill.off .dot{background:#f45b63}
    #stage{
      background:linear-gradient(180deg,#fdf3ff 0%,#eaf6ff 62%,#dff3e2 100%);
      border-radius:30px; box-shadow:var(--shadow); position:relative;
      padding:18px 10px 12px; overflow:hidden; touch-action:none;
    }
    #tower{position:relative;margin:0 auto}
    .block{
      position:absolute; border-radius:22%; cursor:pointer;
      border:3px solid rgba(24,50,73,.55);
      box-shadow:inset 0 -8px 0 rgba(24,50,73,.16), inset 0 6px 0 rgba(255,255,255,.35), 0 4px 0 rgba(24,50,73,.18);
      display:flex; align-items:center; justify-content:center;
      transition:transform .38s cubic-bezier(.3,1.4,.5,1), opacity .18s ease;
      will-change:transform;
    }
    .block span{color:rgba(255,255,255,.95); font-weight:700; pointer-events:none; text-shadow:0 2px 0 rgba(24,50,73,.25); line-height:1}
    .block.pop{transition:transform .18s ease-in, opacity .18s ease-in; z-index:5}
    .block.spawn{animation:spawn .34s cubic-bezier(.3,1.5,.5,1) both}
    @keyframes spawn{from{transform:var(--tf) scale(.3);opacity:0}to{transform:var(--tf) scale(1);opacity:1}}
    .c-red{background:var(--red)} .c-yellow{background:var(--yellow)} .c-blue{background:var(--blue)} .c-green{background:var(--green)}
    .ball{
      position:absolute; width:36px; height:36px; border-radius:50%; z-index:20; pointer-events:none;
      border:3px solid rgba(24,50,73,.55); box-shadow:inset 0 -6px 0 rgba(24,50,73,.18), inset 0 5px 0 rgba(255,255,255,.4);
    }
    .particle{position:absolute;border-radius:50%;pointer-events:none;z-index:15}
    #ground{height:10px;border-radius:6px;background:rgba(24,50,73,.14);margin:6px auto 0}
    #cannons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:16px 4px 2px;touch-action:none}
    .cannon{
      width:88px;height:88px;border-radius:50%;border:4px solid rgba(24,50,73,.55);cursor:pointer;
      box-shadow:inset 0 -10px 0 rgba(24,50,73,.18), inset 0 8px 0 rgba(255,255,255,.4), 0 6px 0 rgba(24,50,73,.2);
      display:flex;align-items:center;justify-content:center;color:#fff;
      font-size:34px;font-weight:700;text-shadow:0 2px 0 rgba(24,50,73,.3);
      transition:transform .08s ease; font-family:inherit;
    }
    .cannon:active{transform:scale(.9)}
    .cannon:disabled{opacity:.25;filter:grayscale(.4);cursor:default}
    #celebrate{
      position:absolute; inset:0; display:none; place-items:center; z-index:30;
      background:rgba(255,247,232,.55); text-align:center; padding:16px;
    }
    #celebrate.show{display:grid}
    #celebrate .big{font-size:clamp(30px,8vw,46px);font-weight:700}
    #celebrate video{width:min(480px,92%);border-radius:22px;box-shadow:var(--shadow);background:#172b3b}
    #celebrate .tap-hint{font-weight:700;opacity:.75;margin-top:8px;font-size:17px}
    .parent{
      margin-top:14px;background:var(--card);border-radius:20px;box-shadow:0 5px 0 rgba(24,50,73,.08);
      padding:12px 16px;font-family:"Nunito Sans",sans-serif;font-size:14.5px;line-height:1.5;
    }
    .parent b{font-family:"Fredoka",sans-serif}
    .parent .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
    .pbtn{
      border:0;border-radius:14px;padding:10px 16px;font-family:"Fredoka",sans-serif;font-weight:700;font-size:15px;
      background:#58c472;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(24,50,73,.15);min-height:48px;
    }
    .pbtn.plain{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 3px rgba(24,50,73,.18)}
    .parent a{color:#2b7bbb;font-weight:800}
    .foot{margin-top:10px;text-align:center;font-size:13px;opacity:.6;font-weight:700}
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <img class="mascot" id="mascot" src="images/liam-mascot.webp" alt="Bear cub mascot"/>
    <h1>Block Pop</h1>
    <button class="sound-pill" id="sound-pill" aria-label="Sound state and toggle"><span class="dot"></span><span id="sound-label">Sound: tap to start</span></button>
  </header>

  <div id="stage">
    <div id="tower" aria-label="Tower of blocks"></div>
    <div id="ground"></div>
    <div id="celebrate" aria-hidden="true">
      <div>
        <div class="big">🎉 Yay!</div>
        <video id="cel-video" playsinline preload="none" style="display:none"></video>
        <div class="tap-hint" id="cel-hint">New tower coming…</div>
      </div>
    </div>
  </div>

  <div id="cannons" aria-label="Color cannons"></div>

  <div class="parent">
    <b>Grown-ups:</b> <span id="coplay">Tap a cannon together — which color will pop the most blocks?</span>
    <div class="row">
      <button class="pbtn" id="test-sound">🔊 Test sound</button>
      <span>Sound engine: <b id="engine">not started</b></span>
      <a href="classic.html">Classic game</a>
    </div>
  </div>

  <div class="foot">Block Pop v2.0 • Tower <span id="tower-num">1</span> • No ads, no tracking — just popping.</div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Audio: built to survive iOS ----------
     Lessons applied: opt into the iOS "playback" session (media channel,
     not silenced by the mute switch), create+resume the context inside
     every tap until it runs, prime with a silent buffer (Voxel Blast fix),
     and show the live engine state so problems are diagnosable. */
  var AC=null, primed=false, muted=false;
  var engineEl=document.getElementById('engine');
  var pill=document.getElementById('sound-pill'), pillLabel=document.getElementById('sound-label');

  function audioInit(){
    try{ if('audioSession' in navigator) navigator.audioSession.type='playback'; }catch(e){}
    if(!AC){
      var Ctx=window.AudioContext||window.webkitAudioContext;
      if(Ctx){ try{ AC=new Ctx(); }catch(e){ AC=null; } }
      if(AC){ AC.onstatechange=refreshAudioUI; }
    }
    if(AC){
      if(AC.state!=='running'){ var p=AC.resume(); if(p&&p.catch) p.catch(function(){}); }
      if(!primed){
        try{
          var b=AC.createBuffer(1,1,AC.sampleRate), s=AC.createBufferSource();
          s.buffer=b; s.connect(AC.destination); s.start(0); primed=true;
        }catch(e){}
      }
    }
    refreshAudioUI();
  }
  function refreshAudioUI(){
    var st=AC?AC.state:'not started';
    if(engineEl) engineEl.textContent=st;
    if(!pill) return;
    pill.classList.remove('on','off');
    if(muted){ pill.classList.add('off'); pillLabel.textContent='Sound: off'; }
    else if(AC&&AC.state==='running'){ pill.classList.add('on'); pillLabel.textContent='Sound: on'; }
    else { pillLabel.textContent='Sound: tap to start'; }
  }
  document.addEventListener('pointerdown', audioInit, {capture:true, passive:true});

  function tone(freq, delay, dur, vol, type, freqEnd, retry){
    if(muted) return;
    if(!AC){ return; }
    if(AC.state!=='running'){
      audioInit();
      if(!retry){ setTimeout(function(){ tone(freq,0,dur,vol,type,freqEnd,true); },80); }
      return;
    }
    delay=delay||0; dur=dur||.3; vol=vol||.2; type=type||'triangle';
    try{
      var t0=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
      o.type=type; o.frequency.setValueAtTime(freq,t0);
      if(freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1),t0+dur);
      g.gain.setValueAtTime(.0001,t0);
      g.gain.exponentialRampToValueAtTime(vol,t0+.015);
      g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t0); o.stop(t0+dur+.05);
    }catch(e){}
  }
  function poof(){ tone(170,0,.16,.18,'sine',80); }
  function fanfare(){ [523.25,659.25,783.99,1046.5].forEach(function(f,i){ tone(f,i*.11,.34,.24,'triangle'); }); }

  pill.addEventListener('click',function(){
    muted=!muted;
    if(!muted){ audioInit(); tone(659.25,0,.25,.25); }
    refreshAudioUI();
  });
  document.getElementById('test-sound').addEventListener('click',function(){
    muted=false; audioInit();
    [261.63,329.63,392,523.25].forEach(function(f,i){ tone(f,i*.13,.32,.3,'triangle'); });
    setTimeout(refreshAudioUI,450);
  });

  /* ---------- Game data ---------- */
  var COLORS=[
    {key:'R', cls:'c-red',    glyph:'\u25CF', note:261.63},
    {key:'Y', cls:'c-yellow', glyph:'\u25B2', note:293.66},
    {key:'B', cls:'c-blue',   glyph:'\u25A0', note:329.63},
    {key:'G', cls:'c-green',  glyph:'\u2605', note:392.00}
  ];
  SCALE=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];
  var SHAPES=[
    ["RRYYG","RYYGG","BBRRG"],
    ["..B..",".BBB.","YYGGY","RYYGR"],
    ["....G","...GG","..YGG",".YYBB","RRRBB"],
    ["R...R","RR.RR","YBBBY","YGGGY"],
    ["R.R.R","RRRRR",".YYY.","GYBYG","GBBBG"],
    ["RR...","YRR..","YYBB.",".GBBG",".GGRR"]
  ];
  var PERMS=[[0,1,2,3],[1,2,3,0],[2,3,0,1],[3,0,1,2],[1,3,0,2],[2,0,3,1]];
  var COPLAY=[
    "Tap a cannon together \u2014 which color will pop the most blocks?",
    "Count the pops out loud together: one, two, three!",
    "Ask Liam: red or blue? Then tap the cannon he picks.",
    "Make the popping sound together \u2014 pop, pop, pop!",
    "After this tower, go pop some real bubble wrap or stomp in a puddle."
  ];
  var MOVIES=['video/frog-garden.mp4','video/frog-lilypad.mp4'];

  var stage=document.getElementById('stage'), towerEl=document.getElementById('tower'),
      cannonsEl=document.getElementById('cannons'), ground=document.getElementById('ground'),
      celebrateEl=document.getElementById('celebrate'), celVideo=document.getElementById('cel-video'),
      celHint=document.getElementById('cel-hint'), mascot=document.getElementById('mascot');

  var grid=[], rows=0, cols=0, bs=64, nodes={}, nextId=1, busy=false;
  var level=0; try{ level=parseInt(localStorage.getItem('bp-level')||'0',10)||0; }catch(e){}
  var towersCleared=0;

  function buildTower(){
    var shape=SHAPES[level%SHAPES.length];
    var perm=PERMS[Math.floor(level/SHAPES.length)%PERMS.length];
    rows=shape.length; cols=shape[0].length;
    grid=[];
    for(var r=0;r<rows;r++){
      grid.push([]);
      for(var c=0;c<cols;c++){
        var ch=shape[r][c];
        if(ch==='.'){ grid[r].push(null); continue; }
        var base='RYBG'.indexOf(ch);
        grid[r].push({id:nextId++, color:perm[base]});
      }
    }
    layout(true);
    renderCannons();
    document.getElementById('tower-num').textContent=String(level+1);
    document.getElementById('coplay').textContent=COPLAY[level%COPLAY.length];
  }

  function layout(spawn){
    var w=Math.min(stage.clientWidth-20, 520);
    bs=Math.floor(w/cols);
    towerEl.style.width=(bs*cols)+'px';
    towerEl.style.height=(bs*rows)+'px';
    ground.style.width=(bs*cols)+'px';
    var seen={};
    for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
      var cell=grid[r][c]; if(!cell) continue;
      seen[cell.id]=true;
      var el=nodes[cell.id];
      if(!el){
        el=document.createElement('div');
        el.className='block '+COLORS[cell.color].cls;
        el.dataset.id=cell.id;
        var sp=document.createElement('span');
        sp.textContent=COLORS[cell.color].glyph;
        el.appendChild(sp);
        el.addEventListener('pointerdown', onBlockTap);
        nodes[cell.id]=el; towerEl.appendChild(el);
        if(spawn){ el.classList.add('spawn'); el.style.animationDelay=((r*cols+c)*28)+'ms';
          (function(el2,d){ setTimeout(function(){ el2.classList.remove('spawn'); }, d+460); })(el,(r*cols+c)*28); }
      }
      var tf='translate('+(c*bs+3)+'px,'+(r*bs+3)+'px)';
      el.style.width=(bs-6)+'px'; el.style.height=(bs-6)+'px';
      el.style.setProperty('--tf', tf);
      el.style.transform=tf;
      el.firstChild.style.fontSize=Math.round(bs*.42)+'px';
    }
    Object.keys(nodes).forEach(function(id){
      if(!seen[id]){ nodes[id].remove(); delete nodes[id]; }
    });
  }

  function renderCannons(){
    cannonsEl.innerHTML='';
    var present={};
    grid.forEach(function(row){ row.forEach(function(cell){ if(cell) present[cell.color]=true; }); });
    COLORS.forEach(function(col, idx){
      var b=document.createElement('button');
      b.className='cannon '+col.cls; b.textContent=col.glyph;
      b.setAttribute('aria-label','Fire the '+col.key+' cannon');
      b.disabled=!present[idx];
      b.addEventListener('click', function(){ fireCannon(idx, b); });
      cannonsEl.appendChild(b);
    });
  }

  function clusterOf(r0,c0){
    var color=grid[r0][c0].color, seen={}, stack=[[r0,c0]], out=[];
    while(stack.length){
      var cur=stack.pop(), r=cur[0], c=cur[1], k=r+','+c;
      if(seen[k]) continue; seen[k]=true;
      if(r<0||c<0||r>=rows||c>=cols) continue;
      var cell=grid[r][c]; if(!cell||cell.color!==color) continue;
      out.push({r:r,c:c,cell:cell});
      stack.push([r+1,c],[r-1,c],[r,c+1],[r,c-1]);
    }
    return out;
  }

  function targetFor(color){
    var best=null;
    for(var r=rows-1;r>=0;r--) for(var c=0;c<cols;c++){
      var cell=grid[r][c];
      if(cell&&cell.color===color){ return {r:r,c:c}; }
    }
    return best;
  }

  function fireCannon(colorIdx, btn){
    if(busy) return;
    var t=targetFor(colorIdx); if(!t) return;
    busy=true; poof();
    var bRect=btn.getBoundingClientRect(),
        tEl=nodes[grid[t.r][t.c].id], tRect=tEl.getBoundingClientRect();
    var ball=document.createElement('div');
    ball.className='ball '+COLORS[colorIdx].cls;
    ball.style.position='fixed'; ball.style.zIndex='60';
    ball.style.left=(bRect.left+bRect.width/2-18)+'px'; ball.style.top=(bRect.top+bRect.height/2-18)+'px';
    document.body.appendChild(ball);
    var dx=(tRect.left+tRect.width/2)-(bRect.left+bRect.width/2),
        dy=(tRect.top+tRect.height/2)-(bRect.top+bRect.height/2);
    var anim=ball.animate([
      {transform:'translate(0px,0px)'},
      {transform:'translate('+(dx*.5)+'px,'+(dy*.5-52)+'px)', offset:.55},
      {transform:'translate('+dx+'px,'+dy+'px)'}
    ], {duration:260, easing:'ease-out'});
    anim.onfinish=function(){
      ball.remove();
      popCluster(clusterOf(t.r,t.c));
    };
  }

  function onBlockTap(e){
    if(busy) return;
    var id=parseInt(e.currentTarget.dataset.id,10);
    for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
      if(grid[r][c]&&grid[r][c].id===id){ busy=true; popCluster(clusterOf(r,c)); return; }
    }
  }

  function popCluster(cluster){
    if(!cluster.length){ busy=false; return; }
    var baseIdx=cluster[0].cell.color;
    cluster.sort(function(a,b){ return (b.r-a.r)||(a.c-b.c); });
    cluster.forEach(function(item, i){
      tone(SCALE[(baseIdx+i)%SCALE.length], i*.055, .3, .22, 'triangle');
      var el=nodes[item.cell.id];
      burst(item);
      if(el){ el.classList.add('pop'); el.style.transform=el.style.transform+' scale(.15)'; el.style.opacity='0'; }
      grid[item.r][item.c]=null;
    });
    setTimeout(function(){
      cluster.forEach(function(item){ var el=nodes[item.cell.id]; if(el){ el.remove(); delete nodes[item.cell.id]; } });
      applyGravity();
      layout(false);
      renderCannons();
      busy=false;
      if(isCleared()) onClear();
    }, 210);
  }

  function burst(item){
    var el=nodes[item.cell.id]; if(!el) return;
    var sRect=stage.getBoundingClientRect(), eRect=el.getBoundingClientRect();
    var cx=eRect.left+eRect.width/2-sRect.left, cy=eRect.top+eRect.height/2-sRect.top;
    for(var i=0;i<6;i++){
      var p=document.createElement('div');
      p.className='particle';
      var size=7+Math.random()*8;
      p.style.width=size+'px'; p.style.height=size+'px';
      p.style.left=(cx-size/2)+'px'; p.style.top=(cy-size/2)+'px';
      p.style.background=i%2? '#ffffff' : getComputedStyle(el).backgroundColor;
      stage.appendChild(p);
      var ang=Math.random()*Math.PI*2, dist=26+Math.random()*36;
      var a=p.animate([
        {transform:'translate(0,0)', opacity:1},
        {transform:'translate('+(Math.cos(ang)*dist)+'px,'+(Math.sin(ang)*dist+14)+'px)', opacity:0}
      ], {duration:380+Math.random()*160, easing:'ease-out'});
      a.onfinish=function(){ p.remove(); };
    }
  }

  function applyGravity(){
    for(var c=0;c<cols;c++){
      var stack=[];
      for(var r=rows-1;r>=0;r--) if(grid[r][c]) stack.push(grid[r][c]);
      for(var r2=rows-1;r2>=0;r2--) grid[r2][c]=stack[rows-1-r2]||null;
    }
  }

  function isCleared(){
    return grid.every(function(row){ return row.every(function(cell){ return !cell; }); });
  }

  function confetti(){
    var sRect=stage.getBoundingClientRect();
    for(var i=0;i<26;i++){
      var p=document.createElement('div');
      p.className='particle';
      var size=8+Math.random()*8;
      p.style.width=size+'px'; p.style.height=size+'px';
      p.style.left=(sRect.width/2-40+Math.random()*80)+'px'; p.style.top='-6px';
      p.style.background=['#f45b63','#ffc93c','#48a8e8','#58c472'][i%4];
      stage.appendChild(p);
      var dx=(Math.random()*2-1)*130, dy=220+Math.random()*160;
      var anim=p.animate([
        {transform:'translate(0,0) rotate(0deg)', opacity:1},
        {transform:'translate('+dx+'px,'+dy+'px) rotate('+(Math.random()*360)+'deg)', opacity:0}
      ], {duration:950+Math.random()*350, easing:'cubic-bezier(.2,.7,.4,1)'});
      (function(pp){ anim.onfinish=function(){ pp.remove(); }; })(p);
    }
  }

  function onClear(){
    towersCleared++;
    fanfare(); confetti();
    mascot.classList.remove('dance'); void mascot.offsetWidth; mascot.classList.add('dance');
    level++; try{ localStorage.setItem('bp-level', String(level)); }catch(e){}
    if(towersCleared%3===0){
      celVideo.src=MOVIES[(towersCleared/3-1)%MOVIES.length];
      celVideo.style.display='block'; celHint.textContent='Tap for a new tower';
      celebrateEl.classList.add('show'); celebrateEl.setAttribute('aria-hidden','false');
      celVideo.currentTime=0;
      var vp=celVideo.play(); if(vp&&vp.catch) vp.catch(function(){});
      var done=function(){
        celVideo.removeEventListener('ended', done);
        celebrateEl.removeEventListener('click', done);
        celebrateEl.classList.remove('show'); celebrateEl.setAttribute('aria-hidden','true');
        celVideo.pause(); celVideo.style.display='none';
        buildTower();
      };
      celVideo.addEventListener('ended', done);
      celebrateEl.addEventListener('click', done);
    } else {
      celVideo.style.display='none'; celHint.textContent='New tower coming\u2026';
      celebrateEl.classList.add('show'); celebrateEl.setAttribute('aria-hidden','false');
      setTimeout(function(){
        celebrateEl.classList.remove('show'); celebrateEl.setAttribute('aria-hidden','true');
        buildTower();
      }, 1400);
    }
  }

  stage.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  var rzT=null;
  window.addEventListener('resize', function(){ clearTimeout(rzT); rzT=setTimeout(function(){ layout(false); },120); });

  buildTower();
  refreshAudioUI();
})();
</script>
